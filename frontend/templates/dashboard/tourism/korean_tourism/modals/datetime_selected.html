{% load static %}

<!-- Modal for Date Time Selection -->
<div class="modal fade" id="datetimeModal" tabindex="-1" aria-labelledby="datetimeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="datetimeModalLabel">Select Date & Time Range</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="datetimeForm">
                    <div class="mb-3">
                        <label for="startDatetime" class="form-label">Start Date & Time</label>
                        <input type="datetime-local" class="form-control" id="startDatetime" name="startDatetime" required>
                    </div>
                    <div class="mb-3">
                        <label for="endDatetime" class="form-label">End Date & Time</label>
                        <input type="datetime-local" class="form-control" id="endDatetime" name="endDatetime" required>
                    </div>
                    <div class="alert alert-danger d-none" id="datetimeError" role="alert">
                        End date & time must be after start date & time.
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="applyDatetimeBtn">Apply</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Wait for DOM to be fully loaded
    (function() {
        'use strict';
        
        // Function to initialize the datetime modal
        function initializeDatetimeModal() {
            console.log('Initializing datetime modal...');
            
            const startDatetimeInput = document.getElementById('startDatetime');
            const endDatetimeInput = document.getElementById('endDatetime');
            const applyDatetimeBtn = document.getElementById('applyDatetimeBtn');
            const datetimeError = document.getElementById('datetimeError');

            if (!startDatetimeInput || !endDatetimeInput || !applyDatetimeBtn || !datetimeError) {
                console.error('DateTime modal elements not found!');
                return;
            }

            console.log('✅ All datetime modal elements found');

            // Function to convert datetime-local format to display format
            function convertDatetimeFormat(datetimeLocal) {
                // datetime-local format: 2025-10-20T09:00
                // Convert to: 2025-10-20 09:00
                return datetimeLocal.replace('T', ' ');
            }

            // Function to calculate duration
            function calculateDuration(startDatetime, endDatetime) {
                const start = new Date(startDatetime);
                const end = new Date(endDatetime);
                const diffMs = end - start;
                const diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
                const diffHours = Math.ceil(diffMs / (1000 * 60 * 60));

                let text = '';
                if (diffDays === 1) {
                    text = '1 day';
                } else if (diffDays < 7) {
                    text = `${diffDays} days`;
                } else {
                    const weeks = Math.floor(diffDays / 7);
                    const remainingDays = diffDays % 7;
                    if (remainingDays === 0) {
                        text = weeks === 1 ? '1 week' : `${weeks} weeks`;
                    } else {
                        text = `${weeks} week${weeks > 1 ? 's' : ''} ${remainingDays} day${remainingDays > 1 ? 's' : ''}`;
                    }
                }

                return { days: diffDays, hours: diffHours, text: text };
            }

            // Function to save datetime data
            function saveDatetimeData(startDatetime, endDatetime) {
                // Convert format
                const startFormatted = convertDatetimeFormat(startDatetime);
                const endFormatted = convertDatetimeFormat(endDatetime);

                // Extract date and time parts
                const startParts = startFormatted.split(' ');
                const endParts = endFormatted.split(' ');

                const startDate = startParts[0];
                const startTime = startParts[1];
                const endDate = endParts[0];
                const endTime = endParts[1];

                // Calculate duration
                const duration = calculateDuration(startDatetime, endDatetime);

                // Create data object
                const datetimeData = {
                    startDateTime: startFormatted,
                    endDateTime: endFormatted,
                    startDate: startDate,
                    endDate: endDate,
                    startTime: startTime,
                    endTime: endTime,
                    duration: duration,
                    savedAt: new Date().toISOString()
                };

                // Store in window object for immediate access
                window.selectedDateTimeData = datetimeData;
                window.selectedDatetimeData = datetimeData; // Backward compatibility

                // Store in localStorage for persistence
                try {
                    localStorage.setItem('tripDateTimeData', JSON.stringify(datetimeData));
                    console.log('✅ DateTime data saved successfully:', datetimeData);
                } catch (e) {
                    console.error('Failed to save to localStorage:', e);
                }

                // Dispatch custom event for other components to react
                window.dispatchEvent(new CustomEvent('datetimeRangeUpdated', { 
                    detail: datetimeData 
                }));

                return datetimeData;
            }

            // Function to load saved datetime data
            function loadDatetimeData() {
                try {
                    const stored = localStorage.getItem('tripDateTimeData');
                    if (stored) {
                        const data = JSON.parse(stored);
                        window.selectedDateTimeData = data;
                        window.selectedDatetimeData = data;
                        console.log('📅 DateTime data loaded from storage:', data);

                        // Populate form fields if they exist
                        if (data.startDateTime && startDatetimeInput) {
                            // Convert back to datetime-local format
                            const startLocal = data.startDateTime.replace(' ', 'T');
                            startDatetimeInput.value = startLocal;
                        }
                        if (data.endDateTime && endDatetimeInput) {
                            const endLocal = data.endDateTime.replace(' ', 'T');
                            endDatetimeInput.value = endLocal;
                        }

                        return data;
                    }
                } catch (e) {
                    console.error('Failed to load from localStorage:', e);
                }
                return null;
            }

            // Apply datetime selection - Main function
            applyDatetimeBtn.addEventListener('click', function(e) {
                e.preventDefault(); // Prevent any default behavior
                console.log('✅ Apply button clicked!');
                
                const startDatetime = startDatetimeInput.value;
                const endDatetime = endDatetimeInput.value;

                console.log('Start value:', startDatetime);
                console.log('End value:', endDatetime);

                if (!startDatetime || !endDatetime) {
                    datetimeError.textContent = 'Please select both start and end date & time.';
                    datetimeError.classList.remove('d-none');
                    console.warn('Validation failed: Missing datetime values');
                    return;
                }

                if (new Date(endDatetime) <= new Date(startDatetime)) {
                    datetimeError.textContent = 'End date & time must be after start date & time.';
                    datetimeError.classList.remove('d-none');
                    console.warn('Validation failed: End date not after start date');
                    return;
                }

                datetimeError.classList.add('d-none');

                // Save the datetime data
                const savedData = saveDatetimeData(startDatetime, endDatetime);

                // Show success feedback
                console.log('✅ Start:', savedData.startDateTime);
                console.log('✅ End:', savedData.endDateTime);
                console.log('✅ Duration:', savedData.duration.text);

                // Update UI if there's a display element
                const tripDurationElement = document.getElementById('tripDuration');
                if (tripDurationElement) {
                    tripDurationElement.textContent = `Duration: ${savedData.duration.text}`;
                    tripDurationElement.className = 'badge bg-success';
                }

                // Close modal
                const modalElement = document.getElementById('datetimeModal');
                const modal = bootstrap.Modal.getInstance(modalElement);
                if (modal) {
                    modal.hide();
                } else {
                    // Try alternative method
                    const modalBackdrop = document.querySelector('.modal-backdrop');
                    if (modalBackdrop) {
                        modalBackdrop.remove();
                    }
                    modalElement.classList.remove('show');
                    modalElement.style.display = 'none';
                    document.body.classList.remove('modal-open');
                }

                // Show success notification (optional)
                if (typeof Swal !== 'undefined') {
                    Swal.fire({
                        icon: 'success',
                        title: 'Dates Saved!',
                        text: `Trip duration: ${savedData.duration.text}`,
                        timer: 2000,
                        showConfirmButton: false
                    });
                } else {
                    // Fallback alert
                    alert(`Dates saved successfully! Duration: ${savedData.duration.text}`);
                }
            });

            // Clear error when inputs change
            startDatetimeInput.addEventListener('change', function() {
                datetimeError.classList.add('d-none');
            });

            endDatetimeInput.addEventListener('change', function() {
                datetimeError.classList.add('d-none');
            });

            // Load saved data
            loadDatetimeData();

            console.log('✅ DateTime modal initialized successfully');
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeDatetimeModal);
        } else {
            // DOM is already loaded
            initializeDatetimeModal();
        }

        // Also try to initialize after a short delay as fallback
        setTimeout(initializeDatetimeModal, 500);

    })();

    // Global function to access datetime data
    window.getStoredDatetimeData = function() {
        return window.selectedDateTimeData || window.selectedDatetimeData || null;
    };

    // Global function to clear datetime data
    window.clearDatetimeData = function() {
        window.selectedDateTimeData = null;
        window.selectedDatetimeData = null;
        try {
            localStorage.removeItem('tripDateTimeData');
            console.log('🗑️ DateTime data cleared');
        } catch (e) {
            console.error('Failed to clear localStorage:', e);
        }
        window.dispatchEvent(new CustomEvent('datetimeRangeCleared'));
    };
</script>
