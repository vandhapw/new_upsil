{% load static %}

<!-- Region Selection Modal -->
<div class="modal fade bd-example-modal-lg" id="regionModal" tabindex="-1" aria-labelledby="regionModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="regionModalLabel">
                    <i class="fas fa-map-marked-alt me-2"></i>
                    Select Region
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="regionForm">
                    <!-- Enhanced Country Autocomplete -->
                    <div class="mb-4">
                        <label for="countrySelect" class="form-label">
                            <i class="fas fa-globe me-2"></i>
                            Country
                        </label>
                        <input 
                            type="text" 
                            id="countrySelect" 
                            placeholder="Start typing to search countries..." 
                            autocomplete="off" 
                            required
                            aria-describedby="countryHelp"
                        >
                        <small id="countryHelp" class="form-text text-muted">
                            <i class="fas fa-info-circle me-1"></i>
                            Type at least 2 characters to search
                        </small>
                    </div>
                    
                    <!-- Province Dropdown -->
                    <div class="mb-4">
                        <label for="provinceSelect" class="form-label">
                            <i class="fas fa-map-marker-alt me-2"></i>
                            Province/State
                        </label>
                        <input 
                            type="text" 
                            id="provinceSelect" 
                            placeholder="Start typing to search provinces..." 
                            autocomplete="off" 
                            required
                            disabled
                            aria-describedby="provinceHelp"
                        >
                        <small id="provinceHelp" class="form-text text-muted">
                            <i class="fas fa-info-circle me-1"></i>
                            Type at least 2 characters to search
                        </small>
                    </div>
                    
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <!-- <button type="button" class="btn btn-info" id="chooseHotelBtn" onclick="fetchHotelsForSelectedProvince()" disabled>
                    <i class="fas fa-bed me-1"></i>Choose Hotel
                </button> -->
                <button type="button" class="btn btn-primary" id="confirmRegion">Confirm</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Initialize the enhanced country autocomplete
    window.addEventListener('DOMContentLoaded', function () {
        // Get DOM elements
        const countryInput = document.getElementById('countrySelect');
        const provinceInput = document.getElementById('provinceSelect');
        
        // Store selected data
        let selectedCountryData = null;
        let selectedProvinceData = null;
        
        // Initialize country autocomplete
        const countryAutocomplete = new CountryAutocomplete({
            input: countryInput,
            apiEndpoint: '/tourism/api/autocomplete_country/',
            searchType: 'country',
            minChars: 2,
            debounceDelay: 300,
            maxResults: 8,
            onSelect: function(selectedCountry) {
                console.log('Country selected:', selectedCountry);
                selectedCountryData = selectedCountry;
                
                // Extract country code from the selected country
                const countryCode = selectedCountry.countryCode || 
                                   selectedCountry.properties?.country_code || 
                                   selectedCountry.properties?.country || 
                                   extractCountryCode(selectedCountry.formatted);
                
                console.log('Country code extracted:', countryCode);
                
                // Move map to selected country immediately
                moveMapToRegion(selectedCountry);
                
                // Enable and configure province autocomplete
                if (countryCode) {
                    provinceAutocomplete.setCountryCode(countryCode);
                    provinceAutocomplete.enable();
                    showSelectionFeedback('Country selected! Map moved to region. Now search for provinces.', 'success');
                } else {
                    showSelectionFeedback('Country selected and map moved! Province search may be limited.', 'warning');
                    provinceAutocomplete.enable();
                }
                
                // Reset dependent fields
                provinceInput.value = '';
                selectedProvinceData = null;
            },
            onError: function(error) {
                console.error('Country autocomplete error:', error);
                showSelectionFeedback('Failed to load countries. Please try again.', 'error');
            }
        });
        
        // Initialize province autocomplete
        const provinceAutocomplete = new CountryAutocomplete({
            input: provinceInput,
            // apiEndpoint: '/tourism/api/autocomplete_country/',
            provinceApiEndpoint: '/tourism/api/autocomplete_province/',
            searchType: 'province',
            minChars: 2,
            debounceDelay: 300,
            maxResults: 8,
            onSelect: function(selectedProvince) {
                console.log('Province selected:', selectedProvince);
                selectedProvinceData = selectedProvince;
                
                // Move map to selected province
                moveMapToRegion(selectedProvince);
                
                // Fetch and display province boundary polygon
                fetchAndDisplayProvinceBoundary(selectedProvince);
                
                // Store province data globally for hotel fetching
                window.selectedProvinceData = selectedProvince;
                
                // Enable the Choose Hotel button
                const chooseHotelBtn = document.getElementById('chooseHotelBtn');
                if (chooseHotelBtn) {
                    chooseHotelBtn.disabled = false;
                    chooseHotelBtn.innerHTML = '<i class="fas fa-bed me-1"></i>Choose Hotel';
                }
                
                // Don't automatically fetch hotels - wait for user to click Choose Hotel button
                // fetchAndDisplayHotels(selectedProvince);
                
                // Extract province code or use country code for city search
                const provinceCode = selectedProvince.properties?.state_code || 
                                    selectedProvince.properties?.province_code;
                const countryCode = selectedProvince.countryCode || selectedCountryData?.countryCode;
                
                showSelectionFeedback('Province selected, map moved, and boundary loaded! Click "Choose Hotel" to load hotels.', 'success');
                
                // Reset city field
                selectedCityData = null;
            },
            onError: function(error) {
                console.error('Province autocomplete error:', error);
                showSelectionFeedback('Failed to load provinces. Please try again.', 'error');
            }
        });
        
        
        // Initially disable province and city autocompletes
        provinceAutocomplete.disable();
        
        // Function to move map to selected region
        function moveMapToRegion(regionData) {
            console.log('Moving map to region:', regionData);
            
            // Extract coordinates from the region data
            const lat = regionData.lat || regionData.properties?.lat;
            const lon = regionData.lon || regionData.properties?.lon;
            
            if (!lat || !lon) {
                console.error('No coordinates found in region data:', regionData);
                showSelectionFeedback('Unable to locate region on map - coordinates missing.', 'warning');
                return;
            }
            
            // Try to get map instance from different possible sources
            let mapInstance = null;
            
            // Method 1: Check if displayMap class instance exists
            if (window.displayMap && window.displayMap.getMap) {
                mapInstance = window.displayMap.getMap();
                console.log('Found map via displayMap class instance');
            }
            // Method 2: Check if displayMap singleton instance exists
            else if (window.displayMap && typeof window.displayMap.getInstance === 'function') {
                const instance = window.displayMap.getInstance();
                if (instance && instance.getMap) {
                    mapInstance = instance.getMap();
                    console.log('Found map via displayMap singleton');
                }
            }
            // Method 3: Check if map is stored globally
            else if (window.map) {
                mapInstance = window.map;
                console.log('Found map via global window.map');
            }
            // Method 4: Check for map in displayMap static instance
            else if (window.displayMap && window.displayMap.instance && window.displayMap.instance.map) {
                mapInstance = window.displayMap.instance.map;
                console.log('Found map via displayMap static instance');
            }
            
            if (mapInstance) {
                try {
                    // Determine zoom level based on region type
                    let zoomLevel = 6; // Default zoom
                    
                    if (regionData.properties?.result_type) {
                        switch(regionData.properties.result_type) {
                            case 'country':
                                zoomLevel = 5;
                                break;
                            case 'state':
                            case 'province':
                                zoomLevel = 7;
                                break;
                            case 'city':
                                zoomLevel = 10;
                                break;
                            default:
                                zoomLevel = 6;
                        }
                    }
                    
                    // Check if it's a Leaflet map (most likely based on your displayMap.js)
                    if (mapInstance.setView && typeof mapInstance.setView === 'function') {
                        // Leaflet map - move from Korea to selected region
                        mapInstance.setView([lat, lon], zoomLevel, {
                            animate: true,
                            duration: 2.0 // Longer animation to see the movement from Korea
                        });
                        
                        // Add a marker for the selected region
                        if (window.L && window.L.marker) {
                            // Remove existing region marker if it exists
                            if (window.regionMarker) {
                                mapInstance.removeLayer(window.regionMarker);
                            }
                            
                            // Create new marker with custom icon
                            const customIcon = window.L.divIcon({
                                className: 'region-selection-marker',
                                html: '<i class="fas fa-map-marker-alt" style="color: #e74c3c; font-size: 24px;"></i>',
                                iconSize: [30, 30],
                                iconAnchor: [15, 30]
                            });
                            
                            window.regionMarker = window.L.marker([lat, lon], { icon: customIcon }).addTo(mapInstance);
                            window.regionMarker.bindPopup(`
                                <div class="region-popup" style="min-width: 200px;">
                                    <h6 style="margin-bottom: 10px; color: #2563eb;">
                                        <i class="fas fa-map-marker-alt"></i> ${regionData.formatted || regionData.country}
                                    </h6>
                                    <p style="margin-bottom: 5px;"><strong>Country:</strong> ${regionData.country || regionData.formatted}</p>
                                    <p style="margin-bottom: 5px;"><strong>Coordinates:</strong> ${lat.toFixed(4)}, ${lon.toFixed(4)}</p>
                                    ${regionData.properties?.timezone?.name ? `<p style="margin-bottom: 5px;"><strong>Timezone:</strong> ${regionData.properties.timezone.name}</p>` : ''}
                                    ${regionData.properties?.result_type ? `<p style="margin-bottom: 0;"><strong>Type:</strong> ${regionData.properties.result_type}</p>` : ''}
                                </div>
                            `).openPopup();
                        }
                        
                        console.log(`✅ Map successfully moved from Korea to ${regionData.formatted} at coordinates [${lat}, ${lon}] with zoom ${zoomLevel}`);
                        
                    } 
                    // Check if it's a MapLibre map (fallback)
                    else if (mapInstance.flyTo && typeof mapInstance.flyTo === 'function') {
                        // MapLibre map
                        mapInstance.flyTo({
                            center: [lon, lat], // MapLibre uses [lon, lat] order
                            zoom: zoomLevel,
                            speed: 0.6, // Slower speed to see the movement
                            curve: 1.4
                        });
                        
                        console.log(`✅ MapLibre map moved from Korea to ${regionData.formatted} at coordinates [${lon}, ${lat}] with zoom ${zoomLevel}`);
                    }
                    
                    // Store the region data globally for other components
                    window.currentSelectedRegion = regionData;
                    
                    // Dispatch custom event for other components to listen to
                    const mapMovedEvent = new CustomEvent('mapMovedToRegion', {
                        detail: {
                            region: regionData,
                            coordinates: { lat, lon },
                            zoom: zoomLevel,
                            fromKorea: true // Flag to indicate this was a move from Korea
                        }
                    });
                    document.dispatchEvent(mapMovedEvent);
                    
                } catch (error) {
                    console.error('❌ Error moving map to region:', error);
                    showSelectionFeedback('Error moving map to selected region.', 'error');
                }
            } else {
                console.warn('❌ Map instance not found. Available objects:', {
                    windowDisplayMap: window.displayMap,
                    windowMap: window.map,
                    displayMapType: typeof window.displayMap
                });
                showSelectionFeedback('Map not available for navigation. Please ensure the map is loaded.', 'warning');
            }
        }
        
        // Function to fetch and display province boundary polygon
        async function fetchAndDisplayProvinceBoundary(provinceData) {
            console.log('Fetching boundary for province:', provinceData);
            
            // Get map instance
            let mapInstance = getMapInstance();
            if (!mapInstance) {
                console.warn('Map instance not available for boundary display');
                return;
            }
            
            try {
                // Clear existing province boundary if it exists
                if (window.provinceBoundaryLayer) {
                    mapInstance.removeLayer(window.provinceBoundaryLayer);
                    window.provinceBoundaryLayer = null;
                }
                
                // Show loading indicator
                showSelectionFeedback('Loading province boundary...', 'info');
                
                // Extract province/state information for boundary query
                const provinceName = provinceData.province || 
                                   provinceData.properties?.state || 
                                   provinceData.properties?.province ||
                                   provinceData.properties?.county;
                                   
                const countryCode = provinceData.countryCode || 
                                  provinceData.properties?.country_code;
                                  
                const iso3166_2 = provinceData.properties?.iso3166_2;
                
                console.log('Boundary query params:', { provinceName, countryCode, iso3166_2 });
                
                // Method 1: Try to fetch boundary using Overpass API (OpenStreetMap data)
                let boundaryData = await fetchBoundaryFromOverpass(provinceName, countryCode, iso3166_2);
                
                // Method 2: Fallback to approximate boundary based on bounding box
                if (!boundaryData) {
                    console.log('Overpass API failed, creating approximate boundary');
                    boundaryData = createApproximateBoundary(provinceData);
                }
                
                if (boundaryData) {
                    displayBoundaryOnMap(boundaryData, provinceData);
                    showSelectionFeedback('Province boundary loaded successfully!', 'success');
                } else {
                    showSelectionFeedback('Unable to load province boundary', 'warning');
                }
                
            } catch (error) {
                console.error('Error fetching province boundary:', error);
                showSelectionFeedback('Error loading province boundary', 'error');
            }
        }
        
        // Function to get map instance (reusable)
        function getMapInstance() {
            if (window.displayMap && window.displayMap.getMap) {
                return window.displayMap.getMap();
            } else if (window.displayMapInstance && window.displayMapInstance.getMap) {
                return window.displayMapInstance.getMap();
            } else if (window.map) {
                return window.map;
            } else if (window.displayMap && window.displayMap.instance && window.displayMap.instance.map) {
                return window.displayMap.instance.map;
            }
            return null;
        }
        
        // Function to fetch boundary from Overpass API
        async function fetchBoundaryFromOverpass(provinceName, countryCode, iso3166_2) {
            try {
                // Build Overpass query for administrative boundary
                let overpassQuery = '';
                
                if (iso3166_2) {
                    // Use ISO 3166-2 code for precise boundary (preferred method)
                    overpassQuery = `
                        [out:json][timeout:15];
                        (
                            relation["ISO3166-2"="${iso3166_2}"]["admin_level"~"^[4-6]$"];
                            relation["ref:ISO3166-2"="${iso3166_2}"]["admin_level"~"^[4-6]$"];
                        );
                        out geom;
                    `;
                } else if (provinceName && countryCode) {
                    // Fallback to name-based query
                    overpassQuery = `
                        [out:json][timeout:15];
                        (
                            relation["name"="${provinceName}"]["admin_level"~"^[4-6]$"]["ISO3166-1"="${countryCode.toUpperCase()}"];
                            relation["name:en"="${provinceName}"]["admin_level"~"^[4-6]$"]["ISO3166-1"="${countryCode.toUpperCase()}"];
                        );
                        out geom;
                    `;
                }
                
                if (!overpassQuery) {
                    console.log('Insufficient data for Overpass query');
                    return null;
                }
                
                console.log('Overpass query:', overpassQuery);
                
                const response = await fetch('https://overpass-api.de/api/interpreter', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `data=${encodeURIComponent(overpassQuery)}`
                });
                
                if (!response.ok) {
                    throw new Error(`Overpass API error: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Overpass API response:', data);
                
                if (data.elements && data.elements.length > 0) {
                    // Convert Overpass data to GeoJSON
                    return convertOverpassToGeoJSON(data.elements[0]);
                }
                
                return null;
                
            } catch (error) {
                console.error('Overpass API error:', error);
                return null;
            }
        }
        
        // Function to convert Overpass relation to GeoJSON
        function convertOverpassToGeoJSON(relation) {
            if (!relation.members || relation.members.length === 0) {
                return null;
            }
            
            try {
                // Extract outer ways (boundary)
                const outerWays = relation.members.filter(member => 
                    member.type === 'way' && member.role === 'outer'
                );
                
                if (outerWays.length === 0) {
                    return null;
                }
                
                // Convert to coordinate arrays
                const coordinates = [];
                outerWays.forEach(way => {
                    if (way.geometry && way.geometry.length > 0) {
                        const wayCoords = way.geometry.map(point => [point.lon, point.lat]);
                        coordinates.push(wayCoords);
                    }
                });
                
                if (coordinates.length === 0) {
                    return null;
                }
                
                return {
                    type: 'Feature',
                    properties: {
                        name: relation.tags?.name || 'Province Boundary',
                        admin_level: relation.tags?.admin_level || '4',
                        iso3166_2: relation.tags?.['ISO3166-2'] || relation.tags?.['ref:ISO3166-2']
                    },
                    geometry: {
                        type: 'Polygon',
                        coordinates: coordinates
                    }
                };
                
            } catch (error) {
                console.error('Error converting Overpass data to GeoJSON:', error);
                return null;
            }
        }
        
        // Function to create approximate boundary based on bounding box
        function createApproximateBoundary(provinceData) {
            const lat = provinceData.lat || provinceData.properties?.lat;
            const lon = provinceData.lon || provinceData.properties?.lon;
            
            if (!lat || !lon) {
                return null;
            }
            
            // Create a rough circular/rectangular boundary around the center point
            // This is a fallback when precise boundary data is not available
            const radius = 0.5; // Degrees (approximately 55km)
            
            const coordinates = [];
            const sides = 20; // Number of sides for the polygon
            
            for (let i = 0; i <= sides; i++) {
                const angle = (i * 2 * Math.PI) / sides;
                const pointLat = lat + (radius * Math.cos(angle));
                const pointLon = lon + (radius * Math.sin(angle));
                coordinates.push([pointLon, pointLat]);
            }
            
            return {
                type: 'Feature',
                properties: {
                    name: provinceData.province || provinceData.formatted,
                    approximateBoundary: true
                },
                geometry: {
                    type: 'Polygon',
                    coordinates: [coordinates]
                }
            };
        }

        // Helper function to extract amenities from hotel properties
        function extractAmenities(properties) {
            const amenities = [];
            
            // Safely check properties to avoid undefined errors
            if (!properties || typeof properties !== 'object') {
                return ['WiFi', 'Room Service']; // Default amenities
            }
            
            // Check various property fields for amenities
            if (properties.facilities) {
                if (properties.facilities.internet_access) amenities.push('WiFi');
                if (properties.facilities.wheelchair) amenities.push('Accessible');
                if (properties.facilities.smoking) amenities.push('Smoking Area');
                if (properties.facilities.air_conditioning) amenities.push('Air Conditioning');
            }
            
            if (properties.accommodation) {
                if (properties.accommodation.stars) {
                    amenities.push(`${properties.accommodation.stars} Star`);
                }
                if (properties.accommodation.rooms) {
                    amenities.push(`${properties.accommodation.rooms} Rooms`);
                }
            }
            
            if (properties.contact) {
                if (properties.contact.phone) amenities.push('Phone Service');
                if (properties.contact.email) amenities.push('Email Contact');
            }
            
            if (properties.website) amenities.push('Website');
            
            // If no specific amenities found, add default ones
            if (amenities.length === 0) {
                amenities.push('WiFi', 'Room Service', 'Daily Cleaning');
            }
            
            return amenities;
        }

        // Function to generate star rating HTML
        function generateStarRating(rating) {
            const fullStars = Math.floor(rating);
            const hasHalfStar = rating % 1 >= 0.5;
            const emptyStars = 5 - fullStars - (hasHalfStar ? 1 : 0);
            
            let starsHtml = '';
            
            // Full stars
            for (let i = 0; i < fullStars; i++) {
                starsHtml += '<i class="fas fa-star"></i>';
            }
            
            // Half star
            if (hasHalfStar) {
                starsHtml += '<i class="fas fa-star-half-alt"></i>';
            }
            
            // Empty stars
            for (let i = 0; i < emptyStars; i++) {
                starsHtml += '<i class="far fa-star"></i>';
            }
            
            return starsHtml;
        }

        // Function to highlight hotel in horizontal list when marker is clicked
        function highlightHotelInList(hotelId) {
            const hotelCard = document.querySelector(`.hotel-card[data-hotel-id="${hotelId}"]`);
            if (hotelCard) {
                // Remove previous selection
                document.querySelectorAll('.hotel-card.selected').forEach(card => {
                    card.classList.remove('selected');
                });
                
                // Add selection
                hotelCard.classList.add('selected');
                
                // Scroll to hotel card in horizontal list
                const scrollerWrapper = hotelCard.closest('.scroller-wrapper');
                if (scrollerWrapper) {
                    const cardRect = hotelCard.getBoundingClientRect();
                    const wrapperRect = scrollerWrapper.getBoundingClientRect();
                    const scrollLeft = scrollerWrapper.scrollLeft;
                    const cardLeft = cardRect.left - wrapperRect.left + scrollLeft;
                    const wrapperWidth = wrapperRect.width;
                    const cardWidth = cardRect.width;
                    
                    // Center the card in the viewport
                    const targetScrollLeft = cardLeft - (wrapperWidth / 2) + (cardWidth / 2);
                    
                    scrollerWrapper.scrollTo({
                        left: targetScrollLeft,
                        behavior: 'smooth'
                    });
                }
            }
        }

        // Helper function to extract country code from formatted string
        function extractCountryCode(formattedString) {
            // This is a fallback method - try to extract from common patterns
            const countryMappings = {
                'United States': 'US',
                'United Kingdom': 'GB',
                'Germany': 'DE',
                'France': 'FR',
                'Italy': 'IT',
                'Spain': 'ES',
                'Japan': 'JP',
                'South Korea': 'KR',
                'China': 'CN',
                'India': 'IN',
                'Canada': 'CA',
                'Australia': 'AU',
                'Brazil': 'BR',
                'Mexico': 'MX',
                'Netherlands': 'NL',
                'Belgium': 'BE',
                'Switzerland': 'CH',
                'Austria': 'AT',
                'Sweden': 'SE',
                'Norway': 'NO',
                'Denmark': 'DK',
                'Finland': 'FI'
            };
            
            // Try exact match first
            if (countryMappings[formattedString]) {
                return countryMappings[formattedString];
            }
            
            // Try partial match
            for (const [country, code] of Object.entries(countryMappings)) {
                if (formattedString.toLowerCase().includes(country.toLowerCase()) ||
                    country.toLowerCase().includes(formattedString.toLowerCase())) {
                    return code;
                }
            }
            
            return null;
        }

        // Function to show user feedback
        function showSelectionFeedback(message, type = 'success') {
            // Remove existing feedback
            const existingFeedback = document.querySelector('.selection-feedback');
            if (existingFeedback) {
                existingFeedback.remove();
            }
            
            // Create feedback element
            const feedback = document.createElement('div');
            feedback.className = `selection-feedback alert alert-${type === 'success' ? 'success' : 'danger'} alert-dismissible fade show mt-2`;
            feedback.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'} me-2"></i>
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            
            // Insert after country input container
            const countryContainer = document.querySelector('.autocomplete-container').parentNode;
            countryContainer.appendChild(feedback);
            
            // Auto-remove after 3 seconds
            setTimeout(() => {
                if (feedback.parentNode) {
                    feedback.remove();
                }
            }, 3000);
        }
