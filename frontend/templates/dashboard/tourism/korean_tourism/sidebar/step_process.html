{% load static %}
<link rel="stylesheet" href="{% static 'css/tourism/stepProcess.css' %}?v=1.3">

<style>
/* Hotels container styles for step process */
.hotels-container {
    border: 1px solid #e0e6ed;
    border-radius: 8px;
    padding: 15px;
    background: #f8f9fa;
    max-height: 400px;
    overflow-y: auto;
}

.hotels-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid #dee2e6;
}

.hotels-header h6 {
    margin: 0;
    color: #495057;
    font-weight: 600;
}

/* Hotel map markers */
.hotel-marker-step {
    border: none !important;
    background: transparent !important;
}

.hotel-marker-step .hotel-marker-content {
    background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
    color: white;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    border: 2px solid white;
    cursor: pointer;
    transition: transform 0.2s ease;
}

.hotel-marker-step .hotel-marker-content:hover {
    transform: scale(1.1);
}

.hotel-marker-step .hotel-marker-content i {
    font-size: 10px;
}

.hotel-marker-step .hotel-price {
    font-weight: bold;
    font-size: 10px;
}

/* Selected hotel marker styling */
.hotel-marker-step.selected .hotel-marker-content {
    background: linear-gradient(135deg, #27ae60 0%, #229954 100%) !important;
    animation: selectedPulse 1.5s ease-in-out infinite;
    transform: scale(1.1);
}

.hotel-marker-step.selected .hotel-marker-content::before {
    content: "✓";
    font-weight: bold;
    font-size: 12px;
    margin-right: 2px;
}

.hotel-marker-step.selected .hotel-price {
    display: none;
}

/* Attraction map markers */
.attraction-marker-step {
    border: none !important;
    background: transparent !important;
}

.attraction-marker-step .attraction-marker-content {
    background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
    color: white;
    padding: 4px 8px;
    border-radius: 20px;
    font-size: 11px;
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    border: 2px solid white;
    cursor: pointer;
    transition: transform 0.2s ease;
}

.attraction-marker-step .attraction-marker-content:hover {
    transform: scale(1.1);
}

.attraction-marker-step .attraction-marker-content i {
    font-size: 10px;
}

.attraction-marker-step .attraction-price {
    font-weight: bold;
    font-size: 10px;
}

/* Selected attraction marker styling */
.attraction-marker-step.selected .attraction-marker-content {
    background: linear-gradient(135deg, #27ae60 0%, #229954 100%) !important;
    animation: selectedPulse 1.5s ease-in-out infinite;
    transform: scale(1.1);
}

.attraction-marker-step.selected .attraction-marker-content::before {
    content: "✓";
    font-weight: bold;
    font-size: 12px;
    margin-right: 2px;
}

.attraction-marker-step.selected .attraction-price {
    display: none;
}

/* Pulse animation for selected markers */
@keyframes selectedPulse {
    0%, 100% { 
        box-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 0 0 0 rgba(39, 174, 96, 0.7);
    }
    50% { 
        box-shadow: 0 2px 8px rgba(0,0,0,0.3), 0 0 0 8px rgba(39, 174, 96, 0);
    }
}

/* Horizontal hotels layout */
.hotels-horizontal-wrapper {
    position: relative;
}

.hotels-scroll-container {
    overflow-x: auto;
    overflow-y: hidden;
    scroll-behavior: smooth;
    scrollbar-width: thin;
    scrollbar-color: #cbd5e0 #f1f5f9;
    border-radius: 8px;
}

.hotels-scroll-container::-webkit-scrollbar {
    height: 6px;
}

.hotels-scroll-container::-webkit-scrollbar-track {
    background: #f1f5f9;
    border-radius: 3px;
}

.hotels-scroll-container::-webkit-scrollbar-thumb {
    background: #cbd5e0;
    border-radius: 3px;
}

.hotels-scroll-container::-webkit-scrollbar-thumb:hover {
    background: #a0aec0;
}

.hotels-scroller {
    display: flex;
    gap: 15px;
    padding: 10px 0;
    min-height: 160px;
}

.scroll-controls {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 100%;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 10;
}

.scroll-btn {
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid #e2e8f0;
    border-radius: 50%;
    width: 35px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    pointer-events: auto;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}

.scroll-btn:hover {
    background: #007bff;
    color: white;
    transform: scale(1.1);
}

.scroll-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    background: #f8f9fa;
}

.scroll-btn.scroll-left {
    margin-left: -18px;
}

.scroll-btn.scroll-right {
    margin-right: -18px;
}

.hotels-list {
    display: grid;
    gap: 12px;
}

.step-hotel-card {
    display: flex;
    flex-direction: column;
    background: white;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    transition: all 0.3s ease;
    cursor: pointer;
    position: relative;
    min-width: 280px;
    max-width: 280px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
}

.step-hotel-card:hover {
    border-color: #007bff;
    box-shadow: 0 8px 25px rgba(0,123,255,0.15);
    transform: translateY(-3px);
}

.step-hotel-card.selected {
    border-color: #28a745;
    background: linear-gradient(135deg, #f8fff9 0%, #e8f5e8 100%);
    box-shadow: 0 8px 25px rgba(40,167,69,0.2);
}

.step-hotel-card.selected::after {
    content: "✓";
    position: absolute;
    top: 10px;
    right: 10px;
    background: #28a745;
    color: white;
    border-radius: 50%;
    width: 25px;
    height: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    z-index: 5;
}

.step-hotel-image {
    width: 100%;
    height: 120px;
    object-fit: cover;
    border-radius: 8px 8px 0 0;
}

.step-hotel-info {
    padding: 12px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.step-hotel-name {
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 6px;
    font-size: 16px;
    line-height: 1.3;
}

.step-hotel-location {
    color: #6c757d;
    font-size: 13px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
}

.step-hotel-location i {
    margin-right: 5px;
    color: #dc3545;
    flex-shrink: 0;
}

.step-hotel-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
    padding-top: 8px;
}

.step-hotel-rating {
    display: flex;
    align-items: center;
    color: #ffc107;
    font-size: 13px;
}

.step-hotel-rating i {
    margin-right: 2px;
}

.step-hotel-rating span {
    color: #6c757d;
    margin-left: 4px;
    font-size: 12px;
}

.step-hotel-price {
    font-weight: 600;
    color: #e74c3c;
    font-size: 16px;
}

.hotels-loading {
    text-align: center;
    padding: 20px;
    color: #6c757d;
}

.hotels-loading i {
    font-size: 24px;
    margin-bottom: 10px;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.hotels-error {
    text-align: center;
    padding: 20px;
    color: #dc3545;
    background: #f8d7da;
    border: 1px solid #f5c6cb;
    border-radius: 6px;
}
</style>

<script>
// Hotel integration for step process
async function fetchHotelsForStepProcess() {
    console.log('🏨 Fetching hotels for step process...');
    
    // Check if a province is selected from the region modal
    if (!window.selectedProvinceData) {
        alert('Please select a destination first using the "Choose Destination" button!');
        return;
    }
    
    // Get DOM elements with safety checks
    const hotelBtn = document.getElementById('Hotel');
    const hotelsContainer = document.getElementById('hotels-container');
    const hotelsCount = document.getElementById('hotels-count');
    
    if (!hotelBtn) {
        console.error('Hotel button not found');
        return;
    }
    
    // Show loading state
    hotelBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Loading Hotels...';
    hotelBtn.disabled = true;
    
    // Show hotels container with loading message
    if (hotelsContainer) {
        hotelsContainer.style.display = 'block';
    }
    
    try {
        // Extract place_id from the selected province data
        const placeId = window.selectedProvinceData.properties?.place_id;
        
        if (!placeId) {
            throw new Error('No place_id found in selected province data');
        }
        
        // Fetch hotels from API
        const apiUrl = `/tourism/api/hotels_list/?place_id=${placeId}`;
        console.log('Calling hotels API:', apiUrl);
        
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
            throw new Error(`Hotels API error: ${response.status}`);
        }
        
        const hotelsData = await response.json();
        console.log('Hotels API response:', hotelsData);
        
        // Process hotels data (same logic as in region_selected.html)
        let hotels = [];
        
        if (hotelsData && hotelsData.type === 'FeatureCollection' && hotelsData.features && Array.isArray(hotelsData.features)) {
            // GeoJSON format
            hotels = hotelsData.features.map((feature, index) => {
                // Extract coordinates with multiple fallback options
                let latitude = null;
                let longitude = null;
                
                // Try GeoJSON format first
                if (feature.geometry && feature.geometry.coordinates && Array.isArray(feature.geometry.coordinates)) {
                    longitude = feature.geometry.coordinates[0];
                    latitude = feature.geometry.coordinates[1];
                    console.log('Extracted from geometry:', { latitude, longitude });
                }
                
                // Fallback to properties if available
                if (!latitude || !longitude) {
                    latitude = feature.properties?.latitude || feature.properties?.lat;
                    longitude = feature.properties?.longitude || feature.properties?.lng || feature.properties?.lon;
                }
                
                // Use province coordinates as fallback
                if (!latitude || !longitude) {
                    if (window.selectedProvinceData?.geometry?.coordinates) {
                        longitude = window.selectedProvinceData.geometry.coordinates[0];
                        latitude = window.selectedProvinceData.geometry.coordinates[1];
                    } else if (window.selectedProvinceData?.lat && window.selectedProvinceData?.lng) {
                        latitude = window.selectedProvinceData.lat;
                        longitude = window.selectedProvinceData.lng;
                    }
                }
                
                console.log(`Hotel ${index + 1} coordinates:`, { latitude, longitude, name: feature.properties?.name });
                
                return {
                    id: feature.properties?.place_id || feature.properties?.name || `hotel-${index}`,
                    name: feature.properties?.name || `Hotel ${index + 1}`,
                    rating: feature.properties?.accommodation?.stars || (4.0 + Math.random()).toFixed(1),
                    price: `$${Math.floor(Math.random() * 200 + 100)}`,
                    image: getRandomHotelImage(index),
                    address: feature.properties?.formatted || feature.properties?.address_line2 || 'Address not available',
                    location: feature.properties?.address_line1 || feature.properties?.name || 'Location not specified',
                    amenities: extractHotelAmenities(feature.properties || {}),
                    description: feature.properties?.description || 'Comfortable accommodation with modern amenities',
                    latitude: latitude,
                    longitude: longitude,
                    coordinates: {
                        latitude: latitude,
                        longitude: longitude
                    },
                    contact: feature.properties?.contact,
                    website: feature.properties?.website,
                    properties: feature.properties || {},
                    geometry: feature.geometry || {}
                };
            });
        } else if (hotelsData && hotelsData.features && Array.isArray(hotelsData.features)) {
            // Features array format
            hotels = hotelsData.features.map((feature, index) => {
                // Extract coordinates with multiple fallback options
                let latitude = null;
                let longitude = null;
                
                // Try GeoJSON format first
                if (feature.geometry && feature.geometry.coordinates && Array.isArray(feature.geometry.coordinates)) {
                    longitude = feature.geometry.coordinates[0];
                    latitude = feature.geometry.coordinates[1];
                }
                
                // Fallback to properties if available
                if (!latitude || !longitude) {
                    latitude = feature.properties?.latitude || feature.properties?.lat;
                    longitude = feature.properties?.longitude || feature.properties?.lng || feature.properties?.lon;
                }
                
                // Use province coordinates as fallback
                if (!latitude || !longitude) {
                    if (window.selectedProvinceData?.geometry?.coordinates) {
                        longitude = window.selectedProvinceData.geometry.coordinates[0];
                        latitude = window.selectedProvinceData.geometry.coordinates[1];
                    } else if (window.selectedProvinceData?.lat && window.selectedProvinceData?.lng) {
                        latitude = window.selectedProvinceData.lat;
                        longitude = window.selectedProvinceData.lng;
                    }
                }
                
                console.log(`Hotel ${index + 1} coordinates:`, { latitude, longitude, name: feature.properties?.name });
                
                return {
                    id: feature.properties?.place_id || feature.properties?.name || `hotel-${index}`,
                    name: feature.properties?.name || `Hotel ${index + 1}`,
                    rating: feature.properties?.accommodation?.stars || (4.0 + Math.random()).toFixed(1),
                    price: `$${Math.floor(Math.random() * 200 + 100)}`,
                    image: getRandomHotelImage(index),
                    address: feature.properties?.formatted || feature.properties?.address_line2 || 'Address not available',
                    location: feature.properties?.address_line1 || feature.properties?.name || 'Location not specified',
                    amenities: extractHotelAmenities(feature.properties || {}),
                    description: feature.properties?.description || 'Comfortable accommodation with modern amenities',
                    latitude: latitude,
                    longitude: longitude,
                    coordinates: {
                        latitude: latitude,
                        longitude: longitude
                    },
                    contact: feature.properties?.contact,
                    website: feature.properties?.website,
                    properties: feature.properties || {},
                    geometry: feature.geometry || {}
                };
            });
        } else if (hotelsData && hotelsData.hotels && Array.isArray(hotelsData.hotels)) {
            // Legacy format
            hotels = hotelsData.hotels.map((hotel, index) => {
                // Ensure coordinates are properly set
                let latitude = hotel.latitude || hotel.lat;

// Function to extract amenities (simplified version)
function extractHotelAmenities(properties) {
    const amenities = [];
    
    if (!properties || typeof properties !== 'object') {
        return ['WiFi', 'Room Service', 'Daily Cleaning'];
    }
    
    // Check various property fields for amenities
    if (properties.facilities) {
        if (properties.facilities.internet_access) amenities.push('WiFi');
        if (properties.facilities.wheelchair) amenities.push('Accessible');
        if (properties.facilities.air_conditioning) amenities.push('AC');
    }
    
    if (properties.accommodation) {
        if (properties.accommodation.stars) {
            amenities.push(`${properties.accommodation.stars} Star`);
        }
    }
    
    if (properties.contact) {
        if (properties.contact.phone) amenities.push('Phone Service');
    }
    
    if (properties.website) amenities.push('Website');
    
    // If no specific amenities found, add default ones
    if (amenities.length === 0) {
        amenities.push('WiFi', 'Room Service', 'Daily Cleaning');
    }
    
    return amenities;
}

// Function to display hotels in step process
function displayHotelsInStepProcess(hotels) {
    console.log('✅ Displaying hotels in step process...');
    
    // Normalize coordinates for consistency between horizontal list and map markers
    hotels = hotels.map(hotel => {
        console.log(`🔧 Normalizing coordinates for step process hotel: ${hotel.name}`);
        console.log(`📊 Original hotel coordinate data:`, {
            name: hotel.name,
            latitude: hotel.latitude,
            longitude: hotel.longitude,
            lat: hotel.lat,
            lng: hotel.lng,
            coordinates: hotel.coordinates
        });
        
        let lat = hotel.latitude;
        let lng = hotel.longitude;
        
        console.log(`📍 Initial extracted coordinates: lat=${lat}, lng=${lng}`);
        
        // Be VERY conservative about using fallback coordinates - only if truly missing or invalid
        if (lat === null || lng === null || lat === undefined || lng === undefined || 
            isNaN(lat) || isNaN(lng) || 
            (lat === 0 && lng === 0)) {
            
            console.warn(`⚠️ Truly invalid coordinates for ${hotel.name} (lat=${lat}, lng=${lng}), attempting fallback`);
            
            // Use province coordinates as fallback ONLY if absolutely necessary
            // BUT first check if province coords are Seoul coords - if so, skip fallback entirely
            let fallbackLat = null;
            let fallbackLng = null;
            
            if (window.selectedProvinceData?.geometry?.coordinates) {
                fallbackLng = window.selectedProvinceData.geometry.coordinates[0];
                fallbackLat = window.selectedProvinceData.geometry.coordinates[1];
            } else if (window.selectedProvinceData?.lat && window.selectedProvinceData?.lng) {
                fallbackLat = window.selectedProvinceData.lat;
                fallbackLng = window.selectedProvinceData.lng;
            }
            
            // Check if fallback coords are Seoul coords (37.5665, 126.978) - if so, reject them
            const isSeoulCoords = (Math.abs(fallbackLat - 37.5665) < 0.01) && (Math.abs(fallbackLng - 126.978) < 0.01);
            
            if (isSeoulCoords) {
                console.error(`🚫 Rejecting Seoul coordinates as fallback for ${hotel.name}. Setting to null.`);
                lat = null;
                lng = null;
            } else if (fallbackLat && fallbackLng && !isNaN(fallbackLat) && !isNaN(fallbackLng)) {
                lat = fallbackLat;
                lng = fallbackLng;
                console.log(`📍 Using valid province fallback coordinates: lat=${lat}, lng=${lng}`);
                
                // Add small offset to avoid overlapping
                const offsetRange = 0.01;
                lat += (Math.random() - 0.5) * offsetRange;
                lng += (Math.random() - 0.5) * offsetRange;
                console.log(`📍 Added offset for ${hotel.name}: lat=${lat}, lng=${lng}`);
            } else {
                console.error(`❌ No valid fallback coordinates available for ${hotel.name}`);
                lat = null;
                lng = null;
            }
        } else {
            console.log(`✅ Valid coordinates for ${hotel.name}: lat=${lat}, lng=${lng} - NOT using fallback`);
        }
        
        // Ensure coordinates are numbers
        lat = parseFloat(lat) || 0;
        lng = parseFloat(lng) || 0;
        
        console.log(`📍 Final processed coordinates for ${hotel.name}: lat=${lat}, lng=${lng}`);
        
        // Standardize coordinate format for compatibility with displayHotel.js
        return {
            ...hotel,
            latitude: lat,
            longitude: lng,
            lat: lat,
            lng: lng,
            coordinates: {
                latitude: lat,
                longitude: lng
            },
            // Also provide array format for displayHotel.js compatibility
            coordsArray: [lng, lat]
        };
    });
    
    console.log(`✅ Normalized coordinates for ${hotels.length} hotels in step process`);
    
    // Store hotel data globally for debugging
    window.hotelDataForStepProcess = hotels;
    console.log('📊 Stored hotel data globally for debugging:', window.hotelDataForStepProcess);
    
    // Show the hotels container with message
    const hotelsContainer = document.getElementById('hotels-container');
    if (hotelsContainer) {
        hotelsContainer.style.display = 'block';
    }
    
    // Make sure the horizontal overlay exists first
    let overlay = document.getElementById('horizontal-hotel-overlay');
    if (!overlay) {
        console.log('🔄 Horizontal overlay not found, creating it...');
        
        // Try to create the overlay by loading it from template
        const mapContainer = document.querySelector('.map-container') || document.querySelector('#map');
        if (mapContainer) {
            // Create overlay element
            overlay = document.createElement('div');
            overlay.id = 'horizontal-hotel-overlay';
            overlay.style.display = 'none';
            mapContainer.appendChild(overlay);
            
            // Load the overlay content
            fetch('/static/templates/dashboard/tourism/korean_tourism/modals/horizontal_lists.html')
                .then(response => response.text())
                .then(html => {
                    overlay.innerHTML = html;
                    console.log('✅ Loaded horizontal overlay template');
                    // Now display hotels
                    showHotelsInOverlay(hotels, overlay);
                })
                .catch(error => {
                    console.error('Failed to load horizontal overlay template:', error);
                    // Fallback: create basic overlay structure
                    createBasicOverlayStructure(hotels, overlay);
                });
        } else {
            console.error('Map container not found to append horizontal overlay');
            return;
        }
    } else {
        console.log('✅ Horizontal overlay found, displaying hotels...');
        showHotelsInOverlay(hotels, overlay);
    }
}

    });

        latitude: hotel.latitude,
        longitude: hotel.longitude,
        lat: hotel.lat,
        lng: hotel.lng,
        
        // Coordinates object format (from normalization)
        coordinates: hotel.coordinates || {
            latitude: hotel.latitude,
            longitude: hotel.longitude
        },
        
        // Array format for displayHotel.js compatibility
        coordsArray: hotel.coordsArray || [hotel.longitude, hotel.latitude],

        originalData: hotel
    };
    
    // Store coordinate data as JSON in dataset for easy retrieval

    div.dataset.latitude = hotel.latitude;
    div.dataset.longitude = hotel.longitude;

            </div>
            <div class="hotel-price">${hotel.price || '$150'}</div>

    // Store the enhanced hotel data object directly on the DOM element
    div._hotelData = {
        ...hotel,
        ...coordinateData
    };

    div.addEventListener('click', function() {
        // Retrieve the enhanced hotel data with stored coordinates
        const enhancedHotel = div._hotelData || hotel;
        
        console.log(`🎯 Hotel card clicked: ${enhancedHotel.name}`);

    return div;
}

// Function to handle hotel selection from step process
function selectHotelFromStepProcess(hotel, cardElement, index) {
    // Check if travel dates are selected first
    const travelDates = window.selectedDateTimeData || window.selectedDatetimeData;
    if (!travelDates || !travelDates.startDate || !travelDates.endDate) {
        alert('Please select your travel dates first before choosing hotels!');
        return;
    }
    
    // Calculate trip duration
    const startDate = new Date(travelDates.startDate);
    const endDate = new Date(travelDates.endDate);
    const tripDuration = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24));
    
    // Initialize selected hotels array if it doesn't exist
    if (!window.selectedHotelsData) {
        window.selectedHotelsData = [];
    }
    
    // Check if hotel is already selected
    const existingIndex = window.selectedHotelsData.findIndex(h => h.id === hotel.id);
    
    if (existingIndex !== -1) {
        // Hotel is already selected, remove it (toggle off)
        window.selectedHotelsData.splice(existingIndex, 1);
        cardElement.classList.remove('selected');
        
        // Remove selection from corresponding marker
        if (window.hotelMarkers && window.hotelMarkers[index]) {
            const marker = window.hotelMarkers[index];
            const markerElement = marker.getElement();
            
            if (markerElement) {
                markerElement.classList.remove('selected');
                
                // Restore original marker content
                const markerContent = markerElement.querySelector('.hotel-marker-content');
                if (markerContent) {
                    markerContent.innerHTML = `<i class="fas fa-bed"></i> ${hotel.price || '$100'}`;
                }
            }
        }
        
        console.log('🚫 Hotel removed from selection:', hotel.name);
    } else {
        // Check if we can add more hotels (duration validation)
        if (window.selectedHotelsData.length >= tripDuration) {
            alert(`You can only select ${tripDuration} hotel${tripDuration > 1 ? 's' : ''} for your ${tripDuration}-day trip.\n\nIf you need to select this hotel, please remove another one first.`);
            return;
        }
        
        // Hotel is not selected, add it - ensure normalized coordinates are used
        console.log(`🔧 Processing hotel coordinates for: ${hotel.name}`);
        console.log('📊 Original hotel coordinate data:', {
            name: hotel.name,
            latitude: hotel.latitude,
            longitude: hotel.longitude,
            lat: hotel.lat,
            lng: hotel.lng,
            coordinates: hotel.coordinates,
            coordsArray: hotel.coordsArray,
            coordinatesType: Array.isArray(hotel.coordinates) ? 'array' : typeof hotel.coordinates,

// Function to create hotel card for step process
function createStepHotelCard(hotel, index) {
    const div = document.createElement('div');
    div.className = 'step-hotel-card';
    div.dataset.hotelId = hotel.id || index;
    
    // Generate star rating
    const rating = parseFloat(hotel.rating) || 4.0;
    const fullStars = Math.floor(rating);
    const hasHalfStar = rating % 1 >= 0.5;
    let starsHtml = '';
    
    for (let i = 0; i < fullStars; i++) {
        starsHtml += '<i class="fas fa-star"></i>';
    }
    if (hasHalfStar) {
        starsHtml += '<i class="fas fa-star-half-alt"></i>';
    }
    for (let i = fullStars + (hasHalfStar ? 1 : 0); i < 5; i++) {
        starsHtml += '<i class="far fa-star"></i>';
    }
    
    div.innerHTML = `
        <img src="${hotel.image}" alt="${hotel.name}" class="step-hotel-image" loading="lazy">
        <div class="step-hotel-info">
            <div class="step-hotel-name">${hotel.name}</div>
            <div class="step-hotel-location">
                <i class="fas fa-map-marker-alt"></i>
                <span>${(hotel.address || hotel.location || 'Location not specified').substring(0, 40)}${(hotel.address || hotel.location || '').length > 40 ? '...' : ''}</span>
            </div>
            <div class="step-hotel-bottom">
                <div class="step-hotel-rating">
                    ${starsHtml}
                    <span>(${rating})</span>
                </div>
                <div class="step-hotel-price">${hotel.price || '$150'}</div>
            </div>
        </div>
    `;
    
    // Add click handler
    div.addEventListener('click', function() {
        selectHotelInStep(hotel, div);
    });
    
    return div;
}

// Function to handle hotel selection in step process
function selectHotelInStep(hotel, cardElement) {
    // Remove previous selection
    document.querySelectorAll('.step-hotel-card.selected').forEach(card => {
        card.classList.remove('selected');
    });
    
    // Add selection to current card
    cardElement.classList.add('selected');
    
    // Store selected hotel data globally
    window.selectedHotelData = hotel;
    
    console.log('Hotel selected in step process:', hotel.name);
    
    // Trigger custom event for integration
    const hotelSelectedEvent = new CustomEvent('hotelSelected', {
        detail: hotel
    });
    document.dispatchEvent(hotelSelectedEvent);
    
    // Visual feedback
    const hotelBtn = document.getElementById('Hotel');
    if (hotelBtn) {
        hotelBtn.innerHTML = `<i class="fas fa-check me-2"></i>Hotel Selected: ${hotel.name}`;
        hotelBtn.className = 'btn btn-success';
    }
}

// Function to extract amenities (simplified version)
function extractAttractionAmenities(properties) {
    const amenities = [];
    
    if (!properties || typeof properties !== 'object') {
        return amenities;
    }
    
    // Check various property fields for amenities
    if (properties.facilities) {
        if (Array.isArray(properties.facilities)) {
            amenities.push(...properties.facilities);
        } else if (typeof properties.facilities === 'string') {
            amenities.push(properties.facilities);
        }
    }
    
    if (properties.services) {
        if (Array.isArray(properties.services)) {
            amenities.push(...properties.services);
        }
    }
    
    if (properties.contact) {
        amenities.push('Contact Available');
    }
    
    if (properties.website) amenities.push('Website');
    
    // If no specific amenities found, add default ones based on attraction type
    if (amenities.length === 0) {
        amenities.push('Scenic Views', 'Photo Opportunities', 'Walkable');
    }
    
    return amenities;
}

// Function to handle attraction selection from step process
function selectAttractionFromStepProcess(attraction, cardElement, index) {
    // Initialize selected attractions array if it doesn't exist
    if (!window.selectedAttractionsData) {
        window.selectedAttractionsData = [];
    }
    
    // Check if attraction is already selected
    const existingIndex = window.selectedAttractionsData.findIndex(a => a.id === attraction.id);
    
    if (existingIndex !== -1) {
        // Attraction is already selected, remove it (toggle off)
        window.selectedAttractionsData.splice(existingIndex, 1);
        cardElement.classList.remove('selected');
        
        // Remove selection from corresponding marker
        if (window.attractionMarkers && window.attractionMarkers[index]) {
            const marker = window.attractionMarkers[index];
            const markerElement = marker.getElement();
            
            if (markerElement) {
                markerElement.classList.remove('selected');
                
                // Restore original marker content
                const markerContent = markerElement.querySelector('.attraction-marker-content');
                if (markerContent) {
                    markerContent.innerHTML = `<i class="fas fa-map-marker-alt"></i> ${attraction.price || 'Free'}`;
                }
            }
        }
        
        console.log('🚫 Attraction removed from selection:', attraction.name);
        
        // Update marker in displayAttraction instance if available
        if (window.displayAttractionInstance && typeof window.displayAttractionInstance.updateAttractionMarkerFromHorizontalList === 'function') {
            window.displayAttractionInstance.updateAttractionMarkerFromHorizontalList(attraction.id, attraction.name, false);
        }
    } else {
        // Attraction is not selected, add it - ensure all coordinate data is preserved
        const attractionWithCoordinates = {
            ...attraction,
            // Ensure coordinate data is preserved from original selection
            latitude: attraction.latitude || attraction.coordinates?.latitude || attraction.lat,
            longitude: attraction.longitude || attraction.coordinates?.longitude || attraction.lng || attraction.lon,
            coordinates: {
                latitude: attraction.latitude || attraction.coordinates?.latitude || attraction.lat,
                longitude: attraction.longitude || attraction.coordinates?.longitude || attraction.lng || attraction.lon
            },
            // Preserve original geometry and properties for debugging
            geometry: attraction.geometry || {},
            properties: attraction.properties || {}
        };
        
        // Log coordinate capture for debugging
        console.log(`🎯 Capturing attraction "${attraction.name}" coordinates:`, {
            original: attraction,
            captured: {
                latitude: attractionWithCoordinates.latitude,
                longitude: attractionWithCoordinates.longitude,
                coordinates: attractionWithCoordinates.coordinates
            }
        });
        
        window.selectedAttractionsData.push(attractionWithCoordinates);
        cardElement.classList.add('selected');
        
        // Add selection to corresponding marker
        if (window.attractionMarkers && window.attractionMarkers[index]) {
            const marker = window.attractionMarkers[index];
            const markerElement = marker.getElement();
            
            if (markerElement) {
                markerElement.classList.add('selected');
                
                // Update marker content to show check icon
                const markerContent = markerElement.querySelector('.attraction-marker-content');
                if (markerContent) {
                    markerContent.innerHTML = `<i class="fas fa-check"></i> Selected`;
                }
                
                // Open popup and highlight
                marker.openPopup();
                
                // Briefly animate the marker
                markerElement.style.transform = 'scale(1.3)';
                markerElement.style.zIndex = '1000';
                setTimeout(() => {
                    markerElement.style.transform = 'scale(1.1)';
                    markerElement.style.zIndex = '999';
                }, 800);
            }
        }
        
        console.log('✅ Attraction added to selection:', attraction.name);
        
        // Update marker in displayAttraction instance if available
        if (window.displayAttractionInstance && typeof window.displayAttractionInstance.updateAttractionMarkerFromHorizontalList === 'function') {
            window.displayAttractionInstance.updateAttractionMarkerFromHorizontalList(attraction.id, attraction.name, true);
        }
    }
    
    // Update the step process button with count
    const attractionBtn = document.getElementById('Attraction');
    if (attractionBtn) {
        const count = window.selectedAttractionsData.length;
        if (count === 0) {
            attractionBtn.innerHTML = 'Choose Attractions <i class="fa-solid fa-map-marker-alt"></i>';
            attractionBtn.className = 'btn btn-primary';
        } else if (count === 1) {
            attractionBtn.innerHTML = `<i class="fas fa-check me-2"></i>Selected: ${window.selectedAttractionsData[0].name}`;
            attractionBtn.className = 'btn btn-success';
        } else {
            attractionBtn.innerHTML = `<i class="fas fa-check me-2"></i>Selected: ${count} Attractions`;
            attractionBtn.className = 'btn btn-success';
        }
    }
    
    // Show selection feedback
    if (typeof window.showSelectionFeedback === 'function') {
        const action = existingIndex !== -1 ? 'removed' : 'added';
        window.showSelectionFeedback(`Attraction ${action}: ${attraction.name}`, 'success');
    }
    
    // Trigger custom event for integration
    const attractionSelectedEvent = new CustomEvent('attractionSelectionChanged', {
        detail: {
            selectedAttractions: window.selectedAttractionsData,
            count: window.selectedAttractionsData.length,
            action: existingIndex !== -1 ? 'removed' : 'added',
            attraction: attraction
        }
    });
    document.dispatchEvent(attractionSelectedEvent);
    
    console.log(`🎯 Total selected attractions: ${window.selectedAttractionsData.length}`);
}

// Function to generate star rating HTML for attraction step process
function generateStarRatingForAttractionStep(rating) {
    const fullStars = Math.floor(rating);
    const hasHalfStar = rating % 1 >= 0.5;
    const emptyStars = 5 - fullStars - (hasHalfStar ? 1 : 0);
    
    let stars = '';
    
    // Full stars
    for (let i = 0; i < fullStars; i++) {
        stars += '<i class="fas fa-star" style="color: #ffc107; font-size: 14px;"></i>';
    }
    
    // Half star
    if (hasHalfStar) {
        stars += '<i class="fas fa-star-half-alt" style="color: #ffc107; font-size: 14px;"></i>';
    }
    
    // Empty stars
    for (let i = 0; i < emptyStars; i++) {
        stars += '<i class="far fa-star" style="color: #dee2e6; font-size: 14px;"></i>';
    }
    
    return stars;
}

// Function to highlight attraction in horizontal list when marker is clicked
function highlightAttractionInStepList(attractionId) {
    const attractionCards = document.querySelectorAll('.attraction-card[data-attraction-id]');
    
    // Remove existing highlights
    attractionCards.forEach(card => {
        card.classList.remove('selected');
    });
    
    // Find and highlight the matching card
    attractionCards.forEach(card => {
        if (card.dataset.attractionId === attractionId) {
            card.classList.add('selected');
            
            // Scroll the card into view
            const scrollerWrapper = card.closest('.scroller-wrapper');
            if (scrollerWrapper) {
                const cardRect = card.getBoundingClientRect();
                const wrapperRect = scrollerWrapper.getBoundingClientRect();
                
                const targetScrollLeft = card.offsetLeft - (wrapperRect.width / 2) + (cardRect.width / 2);
                
                scrollerWrapper.scrollTo({
                    left: targetScrollLeft,
                    behavior: 'smooth'
                });
            }
        }
    });
}

                };

    if (existingIndex !== -1) {

// Function to initialize wheel scroll for attractions overlay
function initializeAttractionWheelScroll() {
    console.log('🎡 Initializing attraction wheel scroll functionality...');
    
    const attractionOverlay = document.getElementById('horizontal-attraction-overlay');
    if (!attractionOverlay) {
        console.log('❌ Attraction overlay not found');
        return;
    }
    
    const scrollerWrapper = attractionOverlay.querySelector('.scroller-wrapper');
    if (!scrollerWrapper) {
        console.log('❌ Scroller wrapper not found in attraction overlay');
        return;
    }
    
    // Remove any existing wheel listeners to avoid duplicates
    scrollerWrapper.removeEventListener('wheel', handleAttractionWheel);
    
    // Add wheel scroll listener
    scrollerWrapper.addEventListener('wheel', handleAttractionWheel, { passive: false });
    
    console.log('✅ Attraction wheel scroll initialized');
}

// Function to handle wheel scrolling for attractions
function handleAttractionWheel(e) {
    e.preventDefault();
    e.stopPropagation();
    
    const scrollAmount = e.deltaY > 0 ? 200 : -200;
    const currentScrollLeft = e.currentTarget.scrollLeft;
    const newScrollLeft = currentScrollLeft + scrollAmount;
    
    // Smooth scroll to new position
    e.currentTarget.scrollTo({
        left: newScrollLeft,
        behavior: 'smooth'
    });
    
    // Update scroll progress if available
    updateAttractionScrollProgress(e.currentTarget);
}

// Function to update attraction scroll progress
function updateAttractionScrollProgress(scrollerWrapper) {
    const attractionOverlay = document.getElementById('horizontal-attraction-overlay');
    if (!attractionOverlay) return;
    
    const progressBar = attractionOverlay.querySelector('#scroll-progress');
    if (!progressBar) return;
    
    const scrollWidth = scrollerWrapper.scrollWidth;
    const clientWidth = scrollerWrapper.clientWidth;
    const scrollLeft = scrollerWrapper.scrollLeft;
    
    if (scrollWidth <= clientWidth) {
        // No scrolling needed
        progressBar.style.width = '100%';
        return;
    }
    
    const scrollableWidth = scrollWidth - clientWidth;
    const scrollPercentage = (scrollLeft / scrollableWidth) * 100;
    
    progressBar.style.width = `${Math.min(100, Math.max(0, scrollPercentage))}%`;
}

// Function to generate star rating HTML for step process
function generateStarRatingForStep(rating) {
    const fullStars = Math.floor(rating);
    const hasHalfStar = rating % 1 >= 0.5;
    const emptyStars = 5 - fullStars - (hasHalfStar ? 1 : 0);
    
    let starsHtml = '';
    
    // Full stars
    for (let i = 0; i < fullStars; i++) {
        starsHtml += '<i class="fas fa-star"></i>';
    }
    
    // Half star
    if (hasHalfStar) {
        starsHtml += '<i class="fas fa-star-half-alt"></i>';
    }
    
    // Empty stars
    for (let i = 0; i < emptyStars; i++) {
        starsHtml += '<i class="far fa-star"></i>';
    }
    
    return starsHtml;
}

// Function to highlight hotel in horizontal list when marker is clicked
function highlightHotelInStepList(hotelId) {
    const hotelCard = document.querySelector(`.hotel-card[data-hotel-id="${hotelId}"]`);
    if (hotelCard) {
        // Remove previous selection
        document.querySelectorAll('.hotel-card.selected').forEach(card => {
            card.classList.remove('selected');
        });
        
        // Add selection
        hotelCard.classList.add('selected');
        
        // Scroll to hotel card in horizontal list
        const scrollerWrapper = hotelCard.closest('.scroller-wrapper');
        if (scrollerWrapper) {
            const cardRect = hotelCard.getBoundingClientRect();
            const wrapperRect = scrollerWrapper.getBoundingClientRect();
            const scrollLeft = scrollerWrapper.scrollLeft;
            const cardLeft = cardRect.left - wrapperRect.left + scrollLeft;
            const wrapperWidth = wrapperRect.width;
            const cardWidth = cardRect.width;
            
            // Center the card in the viewport
            const targetScrollLeft = cardLeft - (wrapperWidth / 2) + (cardWidth / 2);
            
            scrollerWrapper.scrollTo({
                left: targetScrollLeft,
                behavior: 'smooth'
            });
        }
    }
}

function completeHotelSelectionFromPopup(hotelData, selectedDate, dayNumber, checkOutDate = null) {

    const hotelId = hotelData.id;
    const hotelName = hotelData.name;
    const hotelIndex = window.currentPopupHotelIndex;

    }
    
    // Get the stored hotel data
    const hotel = window.currentPopupHotelData || {
        id: hotelId,
        name: hotelName,
        index: hotelIndex
    };
    
    // Normalize coordinates for consistent storage
    if (hotel.latitude && hotel.longitude) {
        // Already normalized
    } else if (hotel.coordinates) {
        hotel.latitude = hotel.coordinates.latitude;
        hotel.longitude = hotel.coordinates.longitude;
    } else if (hotel.lat && hotel.lng) {
        hotel.latitude = hotel.lat;
        hotel.longitude = hotel.lng;
    } else if (hotel.lat && hotel.lon) {
        hotel.latitude = hotel.lat;
        hotel.longitude = hotel.lon;
    }
    
    console.log(`📍 Hotel coordinates normalized: [${hotel.latitude}, ${hotel.longitude}]`);

    hotel.stayDate = selectedDate; // Keep for compatibility

    if (checkOutDate) {

        hotel.checkOutDate = checkOutDate;
        hotel.dateRange = `${formatDate(selectedDate)} to ${formatDate(checkOutDate)}`;
        console.log(`🗓️ Date range: ${hotel.dateRange}`);
    } else {
        // Single date booking (fallback)
        hotel.checkInDate = selectedDate;
        hotel.checkOutDate = null;
    }
    
    // Helper function to format date
    function formatDate(dateStr) {
        const date = new Date(dateStr);
        const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
        return date.toLocaleDateString('en-US', options);
    }
    
    // Check if hotel is already selected
    const existingIndex = window.selectedHotelsData.findIndex(h => h.id === hotelId);
    
    if (existingIndex !== -1) {
        // Hotel is already selected, update the date
        window.selectedHotelsData[existingIndex] = hotel;

    } else {

        window.selectedHotelsData.push(hotel);
        console.log('✅ Hotel added from popup selection:', hotelName);
    }
    
    // Update the marker to selected state
    if (window.hotelMarkers && window.hotelMarkers[hotelIndex]) {

        const markerElement = marker.getElement();

                    markerContent.title = `${hotel.name} - ${hotel.dateRange}`;
                } else {
                    // Show single day
                    markerContent.innerHTML = `<i class="fas fa-check"></i> Day ${dayNumber}`;
                }
                markerContent.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                markerContent.style.color = 'white';
            }
        }
    }
    
    // Update the hotel button with count
    const hotelBtn = document.getElementById('Hotel');

            hotelBtn.innerHTML = 'Choose Hotels <i class="fa-solid fa-hotel"></i>';

    }

    // Normalize and store coordinates
    let normalizedCoords = null;

        normalizedCoords = [hotel.coordinates.latitude, hotel.coordinates.longitude];

        name: hotelName,

                    console.error(`❌ No valid coordinates available for attraction: ${attraction.name}`);
                    // Set default coordinates (Seoul) as last resort
                    latitude = 37.5665;
                    longitude = 126.9780;
                    console.log(`📍 Using default Seoul coordinates as last resort: ${latitude}, ${longitude}`);
                }
            }
            
            // Validate final coordinates
            if (!latitude || !longitude || isNaN(latitude) || isNaN(longitude)) {
                console.error(`❌ Critical: Final coordinates are still invalid for attraction "${attraction.name}":`, { latitude, longitude });
            } else {
                console.log(`✅ Attraction "${attraction.name}" final coordinates:`, { latitude, longitude });
            }
            
            return {
                id: attraction.id,
                name: attraction.name,
                type: attraction.type || attraction.category,
                rating: attraction.rating,
                price: attraction.price || 'Free',
                address: attraction.address,
                location: attraction.location,
                coordinates: {
                    latitude: parseFloat(latitude) || 0,
                    longitude: parseFloat(longitude) || 0
                },
                amenities: attraction.amenities || [],
                image: attraction.image,
                description: attraction.description,
                contact: attraction.contact || {},
                website: attraction.website || '',
                properties: attraction.properties || {},
                // Preserve original coordinate fields with validation
                latitude: parseFloat(latitude) || 0,
                longitude: parseFloat(longitude) || 0
            };
        });
        console.log(`✅ Attractions data collected: ${tripData.attractions.length} attractions with coordinates`);
        
        // Log coordinate summary for attractions
        const attractionsWithCoords = tripData.attractions.filter(a => a.latitude && a.longitude && !isNaN(a.latitude) && !isNaN(a.longitude));
        console.log(`📊 Attractions coordinate summary: ${attractionsWithCoords.length}/${tripData.attractions.length} have valid coordinates`);
    } else {
        console.warn('⚠️ No attractions selected');
    }
    
    // Calculate summary
    tripData.summary.totalItems = tripData.hotels.length + tripData.attractions.length;
    tripData.summary.isComplete = tripData.destination && tripData.dates && tripData.summary.errors.length === 0;
    
    console.log('📊 Trip data collection summary:', {
        destination: !!tripData.destination,
        dates: !!tripData.dates,
        hotels: tripData.hotels.length,
        attractions: tripData.attractions.length,
        total_items: tripData.summary.totalItems,
        is_complete: tripData.summary.isComplete,
        errors: tripData.summary.errors.length
    });
    
    return tripData;
}

// Function to validate trip data before submission
function validateTripData(tripData) {
    console.log('🔍 Validating trip data...');
    
    const validation = {
        isValid: true,
        errors: [],
        warnings: []
    };
    
    // Check required fields
    if (!tripData.destination) {
        validation.errors.push('Destination is required');
        validation.isValid = false;
    }
    
    // Make dates optional for now - just warn if not set
    if (!tripData.dates) {
        validation.warnings.push('No travel dates selected - using default dates');
        console.warn('⚠️ No travel dates selected, but allowing submission');
    }
    
    // Check if at least one accommodation or attraction is selected
    if (tripData.hotels.length === 0 && tripData.attractions.length === 0) {
        validation.warnings.push('No hotels or attractions selected');
    }
    
    // Validate coordinates
    if (tripData.destination && (!tripData.destination.coordinates.latitude || !tripData.destination.coordinates.longitude)) {
        validation.warnings.push('Destination coordinates are missing');
    }
    
    // Validate hotel coordinates
    tripData.hotels.forEach((hotel, index) => {
        if (!hotel.coordinates.latitude || !hotel.coordinates.longitude || 
            hotel.coordinates.latitude === null || hotel.coordinates.longitude === null ||
            isNaN(hotel.coordinates.latitude) || isNaN(hotel.coordinates.longitude)) {
            validation.warnings.push(`Hotel "${hotel.name}" is missing valid coordinates`);
            console.warn(`⚠️ Hotel coordinate issue:`, hotel.name, hotel.coordinates);
        } else {
            console.log(`✅ Hotel "${hotel.name}" has valid coordinates:`, hotel.coordinates);
        }
    });
    
    // Validate attraction coordinates
    tripData.attractions.forEach((attraction, index) => {
        if (!attraction.coordinates.latitude || !attraction.coordinates.longitude ||
            attraction.coordinates.latitude === null || attraction.coordinates.longitude === null ||
            isNaN(attraction.coordinates.latitude) || isNaN(attraction.coordinates.longitude)) {
            validation.warnings.push(`Attraction "${attraction.name}" is missing valid coordinates`);
            console.warn(`⚠️ Attraction coordinate issue:`, attraction.name, attraction.coordinates);
        } else {
            console.log(`✅ Attraction "${attraction.name}" has valid coordinates:`, attraction.coordinates);
        }
    });
    
    console.log('✅ Validation completed:', {
        isValid: validation.isValid,
        errors: validation.errors.length,
        warnings: validation.warnings.length
    });
    
    return validation;
}

// Function to save trip data to server
async function saveTripDataToServer(tripData) {
    console.log('💾 Saving trip data to server...');
    
    try {
        const response = await fetch('/tourism/api/save_trip/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || ''
            },
            body: JSON.stringify(tripData)
        });
        
        if (!response.ok) {
            throw new Error(`Server error: ${response.status} ${response.statusText}`);
        }
        
        const result = await response.json();
        console.log('✅ Trip data saved successfully:', result);
        
        return {
            success: true,
            data: result,
            message: 'Trip saved successfully!'
        };
        
    } catch (error) {
        console.error('❌ Error saving trip data:', error);
        
        return {
            success: false,
            error: error.message,
            message: 'Failed to save trip data. Please try again.'
        };
    }
}

// Function to save trip data locally (fallback)
function saveTripDataLocally(tripData) {
    console.log('💿 Saving trip data locally...');
    
    try {
        const tripId = `trip_${Date.now()}`;
        const storageKey = `korean_tourism_${tripId}`;
        
        // Save to localStorage
        localStorage.setItem(storageKey, JSON.stringify(tripData));
        
        // Save to session storage as backup
        sessionStorage.setItem('current_trip_data', JSON.stringify(tripData));
        
        // Add to trips list
        const tripsListKey = 'korean_tourism_trips';
        let tripsList = JSON.parse(localStorage.getItem(tripsListKey) || '[]');
        
        tripsList.unshift({
            id: tripId,
            name: `Trip to ${tripData.destination?.name || 'Unknown'}`,
            created: tripData.timestamp,
            destination: tripData.destination?.name,
            dates: tripData.dates?.formatted?.duration,
            hotels_count: tripData.hotels.length,
            attractions_count: tripData.attractions.length,
            total_items: tripData.summary.totalItems
        });
        
        // Keep only last 10 trips
        if (tripsList.length > 10) {
            tripsList = tripsList.slice(0, 10);
        }
        
        localStorage.setItem(tripsListKey, JSON.stringify(tripsList));
        
        console.log('✅ Trip data saved locally with ID:', tripId);
        
        return {
            success: true,
            tripId: tripId,
            message: 'Trip saved locally successfully!'
        };
        
    } catch (error) {
        console.error('❌ Error saving trip data locally:', error);
        
        return {
            success: false,
            error: error.message,
            message: 'Failed to save trip data locally.'
        };
    }
}

// Function to download trip data

    if (!window.currentTripData) {

    }
    
    const dataStr = JSON.stringify(window.currentTripData, null, 2);

    link.click();

// Main submit function
async function submitTripProcess() {
    console.log('🚀 Starting trip submission process...');
    
    // Show loading state
    const submitBtn = document.getElementById('submitProcess');
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Processing...';
    submitBtn.disabled = true;
    
    try {
        // Run coordinate debug check before collection
        console.log('🔍 Running coordinate debug check before submission...');
        debugCoordinates();
        
        // Clean up map markers - show only selected items
        console.log('🧹 Cleaning up map markers before submission...');
        showOnlySelectedMarkers();
        
        // Collect all trip data
        const tripData = collectTripData();
        
        // Additional coordinate validation before submission
        console.log('📊 Final coordinate validation before submission:');
        
        // Check hotels coordinates
        const hotelsWithoutCoords = tripData.hotels.filter(h => 
            !h.coordinates.latitude || !h.coordinates.longitude || 
            isNaN(h.coordinates.latitude) || isNaN(h.coordinates.longitude)
        );
        
        if (hotelsWithoutCoords.length > 0) {
            console.warn('⚠️ Hotels without valid coordinates:', hotelsWithoutCoords.map(h => h.name));
        }
        
        // Check attractions coordinates
        const attractionsWithoutCoords = tripData.attractions.filter(a => 
            !a.coordinates.latitude || !a.coordinates.longitude || 
            isNaN(a.coordinates.latitude) || isNaN(a.coordinates.longitude)
        );
        
        if (attractionsWithoutCoords.length > 0) {
            console.warn('⚠️ Attractions without valid coordinates:', attractionsWithoutCoords.map(a => a.name));
        }
        
        // Log final coordinate summary
        console.log('📍 Final coordinate summary:', {
            destination: {
                hasCoords: !!(tripData.destination?.coordinates?.latitude && tripData.destination?.coordinates?.longitude),
                coords: tripData.destination?.coordinates
            },
            hotels: {
                total: tripData.hotels.length,
                withCoords: tripData.hotels.filter(h => h.coordinates.latitude && h.coordinates.longitude && !isNaN(h.coordinates.latitude) && !isNaN(h.coordinates.longitude)).length,
                invalidCoords: hotelsWithoutCoords.length
            },
            attractions: {
                total: tripData.attractions.length,
                withCoords: tripData.attractions.filter(a => a.coordinates.latitude && a.coordinates.longitude && !isNaN(a.coordinates.latitude) && !isNaN(a.coordinates.longitude)).length,
                invalidCoords: attractionsWithoutCoords.length
            }
        });
        
        // Validate trip data
        const validation = validateTripData(tripData);
        
        if (!validation.isValid) {
            throw new Error(`Validation failed: ${validation.errors.join(', ')}`);
        }
        
        // Show warnings if any
        if (validation.warnings.length > 0) {
            console.warn('⚠️ Validation warnings:', validation.warnings);
        }
        
        // Try to save to server first
        let saveResult = await saveTripDataToServer(tripData);
        
        // If server save fails, save locally
        if (!saveResult.success) {
            console.log('🔄 Server save failed, trying local save...');
            saveResult = saveTripDataLocally(tripData);
        }
        
        if (saveResult.success) {
            // Show success message
            alert(`✅ ${saveResult.message}`);
            
            // Remove unselected markers from map completely
            removeUnselectedMarkersFromMap();
            
            // Display trip summary
            displayTripSummary(tripData);
            
            // Reset form if needed
            // resetTripForm();
            
            console.log('🎉 Trip submission completed successfully!');
            
        } else {
            throw new Error(saveResult.message);
        }
        
    } catch (error) {
        console.error('❌ Trip submission failed:', error);
        alert(`❌ Error: ${error.message}`);
        
    } finally {
        // Restore button state
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    }
}

// Helper function to set date/time data from external modals
function setDateTimeData(startDate, endDate, startTime, endTime) {
    console.log('📅 Setting date/time data:', { startDate, endDate, startTime, endTime });
    
    // Calculate duration
    const start = new Date(startDate + 'T' + (startTime || '00:00'));
    const end = new Date(endDate + 'T' + (endTime || '23:59'));
    const durationMs = end - start;
    const durationDays = Math.ceil(durationMs / (1000 * 60 * 60 * 24));
    
    // Format dates for display
    const formatDate = (dateStr) => {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
        });
    };
    
    // Store in global variable
    window.selectedDateTimeData = {
        startDate: startDate,
        endDate: endDate,
        startTime: startTime || '09:00',
        endTime: endTime || '18:00',
        durationDays: durationDays,
        formattedStart: formatDate(startDate),
        formattedEnd: formatDate(endDate),
        formattedDuration: `${durationDays} day${durationDays > 1 ? 's' : ''} trip`
    };
    
    // Update the datetime button
    const datetimeBtn = document.getElementById('Datetime');
    if (datetimeBtn) {
        datetimeBtn.innerHTML = `<i class="fas fa-calendar-check me-2"></i>Selected: ${window.selectedDateTimeData.formattedDuration}`;
        datetimeBtn.className = 'btn btn-success';
    }
    
    console.log('✅ Date/time data set successfully:', window.selectedDateTimeData);
    
    return window.selectedDateTimeData;
}

// Function to generate star rating for tables
function generateStarRatingForTable(rating) {
    const fullStars = Math.floor(rating);
    const hasHalfStar = rating % 1 >= 0.5;
    const emptyStars = 5 - fullStars - (hasHalfStar ? 1 : 0);
    
    let stars = '';
    
    // Full stars
    for (let i = 0; i < fullStars; i++) {
        stars += '<i class="fas fa-star text-warning"></i>';
    }
    
    // Half star
    if (hasHalfStar) {
        stars += '<i class="fas fa-star-half-alt text-warning"></i>';
    }
    
    // Empty stars
    for (let i = 0; i < emptyStars; i++) {
        stars += '<i class="far fa-star text-muted"></i>';
    }
    
    return stars;
}

// Function to start new activity (clear all selections)
function startNewActivity() {
    console.log('🆕 Starting new activity...');
    
    if (confirm('Are you sure you want to start a new activity? This will clear all current selections.')) {
        // Clear all global selection data
        window.selectedProvinceData = null;
        window.selectedDateTimeData = null;
        window.selectedDatetimeData = null;
        window.selectedHotelsData = [];
        window.selectedAttractionsData = [];
        
        // Reset all buttons to initial state
        resetAllButtons();
        
        // Clear all markers from map
        clearAllMarkersFromMap();
        
        // Close any open overlays
        closeAllOverlays();
        
        // Close the current activity modal
        const modal = bootstrap.Modal.getInstance(document.getElementById('currentActivityModal'));
        if (modal) {
            modal.hide();
        }
        
        // Show success message
        showSuccessMessage('New activity started! All selections have been cleared.');

    }
}

// Function to remove hotel from activity
function removeHotelFromActivity(hotelId) {
    console.log(`🗑️ Removing hotel from activity: ${hotelId}`);
    
    if (confirm('Are you sure you want to remove this hotel from your selection?')) {
        // Find and remove hotel from selectedHotelsData
        if (window.selectedHotelsData && Array.isArray(window.selectedHotelsData)) {
            const initialCount = window.selectedHotelsData.length;
            window.selectedHotelsData = window.selectedHotelsData.filter(hotel => (hotel.id || hotel.index) !== hotelId);
            
            if (window.selectedHotelsData.length < initialCount) {
                // Update hotel button
                updateHotelButtonDisplay();
                
                // Remove hotel marker from map
                removeHotelMarkerFromMap(hotelId);
                
                // Remove hotel card selection
                removeHotelCardSelection(hotelId);
                
                // Remove row from table
                const row = document.getElementById(`hotel-row-${hotelId}`);
                if (row) {
                    row.remove();
                }
                
                showSuccessMessage('Hotel removed successfully!');
                
                // Refresh activity if no hotels left
                if (window.selectedHotelsData.length === 0) {
                    setTimeout(() => refreshCurrentActivity(), 1000);
                }
                
                console.log(`✅ Hotel ${hotelId} removed from activity`);
            } else {
                console.warn(`⚠️ Hotel ${hotelId} not found in selections`);
            }
        }
    }
}

// Function to select hotel dates - wrapper for showHotelDateSelection
function selectHotelDates(hotelId, hotelName) {
    console.log('🏨 selectHotelDates called for:', hotelName, 'ID:', hotelId);
    
    // Find the hotel data from selected hotels or step process hotels
    let hotelData = null;
    
    // First try to find in selectedHotelsData
    if (window.selectedHotelsData && window.selectedHotelsData.length > 0) {
        hotelData = window.selectedHotelsData.find(hotel => 
            (hotel.id === hotelId || hotel.index === hotelId)
        );
    }
    
    // If not found, try to find in step process hotel data
    if (!hotelData && window.stepProcessHotels && window.stepProcessHotels.length > 0) {
        hotelData = window.stepProcessHotels.find(hotel => 
            (hotel.id === hotelId || hotel.index === hotelId)
        );
    }
    
    // If still not found, try to find by name
    if (!hotelData) {
        if (window.selectedHotelsData && window.selectedHotelsData.length > 0) {
            hotelData = window.selectedHotelsData.find(hotel => hotel.name === hotelName);
        }
        if (!hotelData && window.stepProcessHotels && window.stepProcessHotels.length > 0) {
            hotelData = window.stepProcessHotels.find(hotel => hotel.name === hotelName);
        }
    }
    
    if (!hotelData) {
        console.warn('⚠️ Hotel data not found for:', hotelName, 'ID:', hotelId);
        // Create basic hotel data if not found
        hotelData = {
            id: hotelId,
            name: hotelName,
            address: 'Address not available',
            coordinates: {
                latitude: 0,
                longitude: 0
            }
        };
    }
    
    console.log('📍 Found hotel data:', hotelData);
    
    // Check if showHotelDateSelection function exists
    if (typeof window.showHotelDateSelection === 'function') {
        console.log('🎯 Calling showHotelDateSelection...');
        window.showHotelDateSelection(hotelData, null);
    } else {
        console.error('❌ showHotelDateSelection function not available');
        alert('⚠️ Hotel date selection not available. Please ensure the hotel modal is loaded.');
    }
}

// Function to confirm hotel dates
function confirmHotelDates(hotelId, hotelName) {
    const checkIn = document.getElementById('hotelCheckIn').value;
    const checkOut = document.getElementById('hotelCheckOut').value;
    
    if (!checkIn || !checkOut) {
        alert('Please select both check-in and check-out dates!');
        return;
    }
    
    const checkInDate = new Date(checkIn);
    const checkOutDate = new Date(checkOut);
    
    if (checkOutDate <= checkInDate) {
        alert('Check-out date must be after check-in date!');
        return;
    }
    
    // Update hotel data with stay dates
    if (window.selectedHotelsData && Array.isArray(window.selectedHotelsData)) {
        const hotel = window.selectedHotelsData.find(h => (h.id || h.index) === hotelId);
        if (hotel) {
            hotel.stayDates = {
                checkIn: checkIn,
                checkOut: checkOut,
                duration: Math.ceil((checkOutDate - checkInDate) / (1000 * 60 * 60 * 24))
            };
            
            console.log(`✅ Hotel dates confirmed for ${hotelName}:`, hotel.stayDates);
        }
    }
    
    // Close modal
    const modal = bootstrap.Modal.getInstance(document.getElementById('hotelDateModal'));
    if (modal) {
        modal.hide();
    }
    
    // Refresh current activity to show updated dates
    setTimeout(() => refreshCurrentActivity(), 500);
    
    showSuccessMessage(`Hotel stay dates confirmed: ${checkInDate.toLocaleDateString()} - ${checkOutDate.toLocaleDateString()}`);
}

function removeHotelMarkerFromMap(hotelId) {
    if (window.hotelMarkers && Array.isArray(window.hotelMarkers)) {
        const markerIndex = window.hotelMarkers.findIndex(marker => {
            const hotelData = marker._hotelData;
            return hotelData && (hotelData.id || hotelData.index) === hotelId;
        });
        
        if (markerIndex !== -1) {
            const mapInstance = getMapInstanceForStep();
            if (mapInstance) {
                mapInstance.removeLayer(window.hotelMarkers[markerIndex]);
                window.hotelMarkers.splice(markerIndex, 1);
            }
        }
    }
}

            return attractionData && (attractionData.id || attractionData.index) === attractionId;

            if (mapInstance) {
                mapInstance.removeLayer(window.attractionMarkers[markerIndex]);

}

function downloadCurrentActivity() {

        dates: window.selectedDateTimeData || window.selectedDatetimeData,
        hotels: window.selectedHotelsData || [],
        attractions: window.selectedAttractionsData || []
    };
    
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentActivity, null, 2));
    const downloadAnchorNode = document.createElement('a');
    downloadAnchorNode.setAttribute("href", dataStr);
    downloadAnchorNode.setAttribute("download", `current_activity_${new Date().toISOString().split('T')[0]}.json`);
    document.body.appendChild(downloadAnchorNode);
    downloadAnchorNode.click();
    downloadAnchorNode.remove();
    
    console.log('✅ Current activity downloaded');
}

// Test function to validate coordinate extraction
function testCoordinateExtraction(hotel) {
    console.log('🔧 === TESTING COORDINATE EXTRACTION ===');
    console.log('Input hotel data:', hotel);
    
    let finalLat = hotel.latitude || hotel.lat;
    let finalLng = hotel.longitude || hotel.lng;
    
    console.log('Initial extraction:', { 
        finalLat, 
        finalLng,
        coordinatesType: typeof hotel.coordinates,
        coordinatesIsArray: Array.isArray(hotel.coordinates),
        coordinates: hotel.coordinates
    });
    
    // Check if coordinates is an array format [lng, lat] or [lat, lng]
    if (hotel.coordinates && Array.isArray(hotel.coordinates) && hotel.coordinates.length >= 2) {
        // Array format - assume [lng, lat] based on GeoJSON standard
        finalLng = hotel.coordinates[0];
        finalLat = hotel.coordinates[1];
        console.log(`📍 Extracted from coordinates array: [${finalLng}, ${finalLat}]`);
    }
    // Check if coordinates is an object with latitude/longitude properties (FROM STEP PROCESS NORMALIZATION)
    else if (hotel.coordinates && typeof hotel.coordinates === 'object' && !Array.isArray(hotel.coordinates)) {
        // The normalization in displayHotelsInStepProcess creates {latitude: ..., longitude: ...} format
        if (hotel.coordinates.latitude !== undefined && hotel.coordinates.longitude !== undefined) {
            finalLat = hotel.coordinates.latitude;
            finalLng = hotel.coordinates.longitude;
            console.log(`📍 Extracted from normalized coordinates object: {lat: ${finalLat}, lng: ${finalLng}}`);
        } else {
            // Fallback for other object formats
            finalLat = hotel.coordinates.lat || hotel.coordinates.latitude || finalLat;
            finalLng = hotel.coordinates.lng || hotel.coordinates.longitude || finalLng;
            console.log(`📍 Extracted from generic coordinates object: {lat: ${finalLat}, lng: ${finalLng}}`);
        }
    }
    // Check coordsArray if available (from normalization)
    else if (hotel.coordsArray && Array.isArray(hotel.coordsArray) && hotel.coordsArray.length >= 2) {
        finalLng = hotel.coordsArray[0];
        finalLat = hotel.coordsArray[1];
        console.log(`📍 Extracted from coordsArray: [${finalLng}, ${finalLat}]`);
    }
    
    finalLat = parseFloat(finalLat);
    finalLng = parseFloat(finalLng);
    
    const result = {
        finalLat,
        finalLng,
        isValid: !isNaN(finalLat) && !isNaN(finalLng) && finalLat !== null && finalLng !== null,
        extractedCoords: {
            latitude: finalLat,
            longitude: finalLng
        }
    };
    
    console.log('🏆 Extraction result:', result);
    return result;
}

// Validation function to check coordinate consistency
function validateCoordinateConsistency() {
    console.log('🔍 === VALIDATING COORDINATE CONSISTENCY ===');
    
    let isConsistent = true;
    let issues = [];
    
    // Check if any coordinates are Seoul coordinates (the problem)
    const seoulLat = 37.5665;
    const seoulLng = 126.978;
    
    if (window.selectedHotelsData && window.selectedHotelsData.length > 0) {
        window.selectedHotelsData.forEach((hotel, index) => {
            if (hotel.latitude && hotel.longitude) {
                const isSeoul = (Math.abs(hotel.latitude - seoulLat) < 0.01) && 
                               (Math.abs(hotel.longitude - seoulLng) < 0.01);
                
                if (isSeoul) {
                    issues.push(`❌ Hotel "${hotel.name}" has Seoul coordinates instead of actual location`);
                    isConsistent = false;
                } else {
                    console.log(`✅ Hotel "${hotel.name}" has valid coordinates: [${hotel.latitude}, ${hotel.longitude}]`);
                }
            }
        });
    }
    
    if (window.hotelMarkers && window.hotelMarkers.length > 0) {
        window.hotelMarkers.forEach((marker, index) => {
            if (marker._hotelData && marker._hotelData.latitude && marker._hotelData.longitude) {
                const isSeoul = (Math.abs(marker._hotelData.latitude - seoulLat) < 0.01) && 
                               (Math.abs(marker._hotelData.longitude - seoulLng) < 0.01);
                
                if (isSeoul) {
                    issues.push(`❌ Marker "${marker._hotelData.name}" has Seoul coordinates instead of actual location`);
                    isConsistent = false;
                } else {
                    console.log(`✅ Marker "${marker._hotelData.name}" has valid coordinates: [${marker._hotelData.latitude}, ${marker._hotelData.longitude}]`);
                }
            }
        });
    }
    
    console.log('🏆 === VALIDATION RESULT ===');
    if (isConsistent) {
        console.log('✅ COORDINATE CONSISTENCY: PASSED');
        console.log('All hotels have valid, non-Seoul coordinates.');
    } else {
        console.log('❌ COORDINATE CONSISTENCY: FAILED');
        issues.forEach(issue => console.log(issue));
    }
    
    return { isConsistent, issues };
}

// Helper function to retrieve coordinate data from hotel card
function getCoordinateDataFromCard(cardElement) {
    console.log('📋 Retrieving coordinate data from hotel card...');
    
    if (!cardElement) {
        console.warn('❌ No card element provided');
        return null;
    }
    
    // Method 1: Try to get data from _hotelData property
    if (cardElement._hotelData) {
        console.log('✅ Retrieved coordinate data from _hotelData:', cardElement._hotelData);
        return cardElement._hotelData;
    }
    
    // Method 2: Try to get data from dataset
    if (cardElement.dataset.coordinates) {
        try {
            const coordinateData = JSON.parse(cardElement.dataset.coordinates);
            console.log('✅ Retrieved coordinate data from dataset:', coordinateData);
            return coordinateData;
        } catch (error) {
            console.warn('⚠️ Failed to parse coordinate data from dataset:', error);
        }
    }
    
    // Method 3: Fallback to dataset individual values
    if (cardElement.dataset.latitude && cardElement.dataset.longitude) {
        const fallbackData = {
            latitude: parseFloat(cardElement.dataset.latitude),
            longitude: parseFloat(cardElement.dataset.longitude),
            lat: parseFloat(cardElement.dataset.latitude),
            lng: parseFloat(cardElement.dataset.longitude),
            coordinates: {
                latitude: parseFloat(cardElement.dataset.latitude),
                longitude: parseFloat(cardElement.dataset.longitude)
            },
            coordsArray: [parseFloat(cardElement.dataset.longitude), parseFloat(cardElement.dataset.latitude)]
        };
        console.log('✅ Retrieved coordinate data from individual dataset values:', fallbackData);
        return fallbackData;
    }
    
    console.warn('❌ No coordinate data found in hotel card');
    return null;
}

// Comprehensive integration test for horizontal hotel list coordinate storage
function testCompleteHotelCoordinateIntegration() {
    console.log('🔧 === COMPLETE HOTEL COORDINATE INTEGRATION TEST ===');
    
    // Step 1: Check if hotels are loaded
    if (!window.hotelDataForStepProcess || window.hotelDataForStepProcess.length === 0) {
        console.log('❌ No hotel data available. Run fetchHotelsForStepProcess() first.');
        return {
            success: false,
            message: 'No hotel data available'
        };
    }
    
    console.log(`✅ Found ${window.hotelDataForStepProcess.length} hotels in global data`);
    
    // Step 2: Check horizontal cards
    const hotelCards = document.querySelectorAll('.hotel-card.api-loaded');
    console.log(`✅ Found ${hotelCards.length} horizontal hotel cards in DOM`);
    
    if (hotelCards.length === 0) {
        console.log('❌ No horizontal cards found. Hotel display may have failed.');
        return {
            success: false,
            message: 'No horizontal cards found'
        };
    }
    
    // Step 3: Test coordinate storage in each card
    let cardsWithValidCoords = 0;
    let cardsWithInvalidCoords = 0;
    
    hotelCards.forEach((card, index) => {
        const hotelName = card.querySelector('h3')?.textContent || `Hotel ${index + 1}`;
        console.log(`\n🏨 Testing card ${index + 1}: ${hotelName}`);
        
        // Test coordinate retrieval
        const coordinateData = getCoordinateDataFromCard(card);
        
        if (coordinateData && coordinateData.latitude && coordinateData.longitude) {
            console.log(`✅ Valid coordinates found: [${coordinateData.latitude}, ${coordinateData.longitude}]`);
            
            // Test coordinate extraction
            const extractionResult = testCoordinateExtraction(coordinateData);
            if (extractionResult.isValid) {
                console.log(`✅ Coordinate extraction successful`);
                cardsWithValidCoords++;
            } else {
                console.log(`❌ Coordinate extraction failed:`, extractionResult);
                cardsWithInvalidCoords++;
            }
        } else {
            console.log(`❌ No valid coordinates found`);
            cardsWithInvalidCoords++;
        }
    });
    
    // Step 4: Summary
    const totalCards = hotelCards.length;
    const successRate = (cardsWithValidCoords / totalCards) * 100;
    
    console.log('\n📊 === INTEGRATION TEST SUMMARY ===');
    console.log(`Total Cards: ${totalCards}`);
    console.log(`Cards with Valid Coordinates: ${cardsWithValidCoords}`);
    console.log(`Cards with Invalid Coordinates: ${cardsWithInvalidCoords}`);
    console.log(`Success Rate: ${successRate.toFixed(1)}%`);
    
    const result = {
        success: successRate >= 90, // 90% success rate considered good
        totalCards,
        cardsWithValidCoords,
        cardsWithInvalidCoords,
        successRate,
        message: successRate >= 90 
            ? '✅ Integration test PASSED - Coordinates properly integrated'
            : '⚠️ Integration test FAILED - Some coordinates missing or invalid'
    };
    
    console.log(result.message);
    console.log('🔧 === INTEGRATION TEST COMPLETE ===\n');
    
    return result;
}
